services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecomm-py
      POSTGRES_PASSWORD: ecomm-py
      POSTGRES_DB: ecomm-py
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomm-py"]
      interval: 5s
      retries: 5
volumes:
  pgdata: